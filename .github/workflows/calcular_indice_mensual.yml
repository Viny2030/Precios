name: Calcular indice mensual (mes real cerrado)

on:
  schedule:
    - cron: "0 8 2 * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: >
          Periodo a calcular, formato YYYY-MM (ej. "2026-07"). Dejar vacio
          para calcular el mes calendario anterior al de hoy.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: calcular-indice-mensual
  cancel-in-progress: false

jobs:
  calcular:
    # FIX 2026-08-31: self-hosted por la misma razon que ingesta_diaria.yml
    # (ubuntu-latest queda bloqueado por el WAF de datos.produccion.gob.ar).
    # calcular_indice_mensual.py no descarga nada nuevo, pero corre en el
    # mismo runner para no tener que mantener dos configuraciones distintas.
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # FIX 2026-08-31: ver mismo fix en ingesta_diaria.yml — setup-python
      # falla en self-hosted Windows por permisos de Registro, asi que se usa
      # el Python ya instalado en la PC en vez de instalar uno nuevo.
      - name: Preparar entorno Python (venv local del runner)
        shell: bash
        run: |
          python -m venv .venv-ci
          .venv-ci/Scripts/python.exe -m pip install --upgrade pip
          .venv-ci/Scripts/pip.exe install -r requirements.txt

      - name: Determinar periodo a calcular
        id: periodo
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.periodo }}" ]; then
            PERIODO="${{ github.event.inputs.periodo }}"
            echo "Periodo forzado manualmente: $PERIODO"
          else
            # FIX 2026-08-31: "date -d yesterday" solo da el mes anterior si
            # esto corre el dia 1. El cron dispara el dia 2 ("0 8 2 * *"), asi
            # que "yesterday" caia en el dia 1 del MISMO mes (ej. 2/set ->
            # 1/set -> "2026-09" en vez de "2026-08"). Se calcula en cambio
            # restando 1 dia al primer dia del mes actual, que siempre cae en
            # el ultimo dia del mes anterior sin importar que dia del mes
            # corra el job.
            PERIODO=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
            echo "Periodo automatico (mes anterior a hoy): $PERIODO"
          fi
          echo "valor=$PERIODO" >> "$GITHUB_OUTPUT"

      - name: Calcular indice del periodo
        shell: bash
        run: .venv-ci/Scripts/python.exe calcular_indice_mensual.py "${{ steps.periodo.outputs.valor }}"

      - name: Commitear indice actualizado (solo si NO hay Postgres)
        if: ${{ vars.USANDO_POSTGRES != 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indice_caba.sqlite
          if git diff --cached --quiet; then
            echo "Sin cambios para commitear (sin precios reales todavia para ${{ steps.periodo.outputs.valor }}, o el calculo fallo)."
          else
            git commit -m "Calcular indice ${{ steps.periodo.outputs.valor }} $(date -u +%Y-%m-%d)"
            git push
          fi
