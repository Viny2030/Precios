name: Calcular indice mensual (mes real cerrado)

on:
  schedule:
    - cron: "0 8 2 * *"
  workflow_dispatch:
    inputs:
      periodo:
        description: >
          Periodo a calcular, formato YYYY-MM (ej. "2026-07"). Dejar vacio
          para calcular el mes calendario anterior al de hoy.
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: calcular-indice-mensual
  cancel-in-progress: false

jobs:
  calcular:
    # FIX 2026-08-31: self-hosted por la misma razon que ingesta_diaria.yml
    # (ubuntu-latest queda bloqueado por el WAF de datos.produccion.gob.ar).
    # calcular_indice_mensual.py no descarga nada nuevo, pero corre en el
    # mismo runner para no tener que mantener dos configuraciones distintas.
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # FIX 2026-08-31: ver mismo fix en ingesta_diaria.yml — setup-python
      # falla en self-hosted Windows por permisos de Registro, asi que se usa
      # el Python ya instalado en la PC en vez de instalar uno nuevo.
      #
      # FIX 2026-08-31 (bis): "shell: bash" en esta PC resuelve al bash de
      # WSL, no al de Git for Windows -- WSL bash rompe las rutas de Windows
      # con backslash (las borra), por eso "shell: powershell" en todos los
      # pasos custom de aca en mas.
      - name: Preparar entorno Python (venv local del runner)
        shell: powershell
        run: |
          python -m venv .venv-ci
          .venv-ci\Scripts\python.exe -m pip install --upgrade pip
          .venv-ci\Scripts\pip.exe install -r requirements.txt

      - name: Determinar periodo a calcular
        id: periodo
        shell: powershell
        run: |
          if ("${{ github.event.inputs.periodo }}") {
            $periodo = "${{ github.event.inputs.periodo }}"
            Write-Host "Periodo forzado manualmente: $periodo"
          } else {
            # FIX 2026-08-31: el cron dispara el dia 2 de cada mes. El
            # periodo automatico es siempre el mes calendario anterior,
            # calculado como el ultimo dia del mes anterior al de hoy (en
            # UTC), sin importar que dia del mes corra este job.
            $hoy = (Get-Date).ToUniversalTime()
            $primerDiaMesActual = Get-Date -Year $hoy.Year -Month $hoy.Month -Day 1
            $ultimoDiaMesAnterior = $primerDiaMesActual.AddDays(-1)
            $periodo = $ultimoDiaMesAnterior.ToString("yyyy-MM")
            Write-Host "Periodo automatico (mes anterior a hoy): $periodo"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "valor=$periodo"

      - name: Calcular indice del periodo
        shell: powershell
        run: .venv-ci\Scripts\python.exe calcular_indice_mensual.py "${{ steps.periodo.outputs.valor }}"

      - name: Commitear indice actualizado (solo si NO hay Postgres)
        if: ${{ vars.USANDO_POSTGRES != 'true' }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/indice_caba.sqlite
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Sin cambios para commitear (sin precios reales todavia para ${{ steps.periodo.outputs.valor }}, o el calculo fallo)."
          } else {
            $fecha = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "Calcular indice ${{ steps.periodo.outputs.valor }} $fecha"
            git push
          }
