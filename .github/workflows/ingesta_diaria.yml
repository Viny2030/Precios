name: Ingesta diaria SEPA

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dias:
        description: >
          Dias a barrer en esta corrida manual, separados por espacio
          (ej: "Miercoles Jueves Viernes Sabado"). Dejar vacio para que
          corra main.py con el dia de hoy (comportamiento normal diario).
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ingesta-sepa
  cancel-in-progress: false

jobs:
  ingesta:
    # FIX 2026-08-31: ubuntu-latest (nube de GitHub) queda bloqueado por el
    # WAF de datos.produccion.gob.ar (403 confirmado en pruebas reales, tanto
    # desde un runner de GitHub como desde otro entorno en la nube). Desde la
    # IP residencial de una PC normal la descarga SI funciona (confirmado
    # 2026-08-31 corriendo main.py local: trajo datos reales del 24/08). Por
    # eso este job corre en un runner self-hosted instalado en la PC del
    # proyecto en vez de en la infraestructura de GitHub.
    runs-on: self-hosted
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # FIX 2026-08-31: actions/setup-python@v5 en un runner self-hosted de
      # Windows intenta instalar Python desde cero tocando el Registro
      # (HKEY_LOCAL_MACHINE), lo que falla con "Acceso denegado al Registro"
      # si el runner no corre elevado. Como esta PC ya tiene Python instalado
      # (con eso se armo el .venv del proyecto), en vez de instalar nada se
      # crea un venv liviano dentro de la carpeta de trabajo del propio
      # runner, usando el Python que ya esta en el PATH de la maquina.
      #
      # FIX 2026-08-31 (bis): "shell: bash" en esta PC resuelve al bash de
      # WSL, no al de Git for Windows -- WSL bash rompe las rutas de Windows
      # con backslash (las borra), por eso "shell: powershell" en todos los
      # pasos custom de aca en mas (evita el problema de raiz).
      - name: Preparar entorno Python (venv local del runner)
        shell: powershell
        run: |
          python -m venv .venv-ci
          .venv-ci\Scripts\python.exe -m pip install --upgrade pip
          .venv-ci\Scripts\pip.exe install -r requirements.txt

      - name: Correr ingesta
        shell: powershell
        run: |
          if ("${{ github.event.inputs.dias }}") {
            Write-Host "Backfill manual de: ${{ github.event.inputs.dias }}"
            .venv-ci\Scripts\python.exe barrer_semana.py --dias ${{ github.event.inputs.dias }}
          } else {
            Write-Host "Corrida diaria normal (dia de hoy)"
            .venv-ci\Scripts\python.exe main.py
          }

      - name: Commitear archivos versionados actualizados
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ("${{ vars.USANDO_POSTGRES }}" -eq "true") {
            git add data/diccionario_coicop.csv data/clasificacion_pendiente.csv
          } else {
            git add data/indice_caba.sqlite data/diccionario_coicop.csv data/clasificacion_pendiente.csv
          }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Sin cambios para commitear (0 precios nuevos, o WAF bloqueo la descarga hoy)."
          } else {
            $fecha = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd")
            git commit -m "Ingesta SEPA $fecha"
            git push
          }
